name: Docker Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: false
        load: true
        tags: ravkav-builder:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Extract APK from Docker
      run: |
        docker run --rm \
          -v ${{ github.workspace }}/output:/output \
          ravkav-builder:latest \
          cp /output/EnhancedRavKavReader.apk /output/ || true

    - name: Find APK
      run: |
        find output -name "*.apk" -type f
        ls -lah output/ || echo "No output directory"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v3
      if: success()
      with:
        name: EnhancedRavKavReader
        path: |
          output/*.apk
          reader_app/build/outputs/apk/**/*.apk
        retention-days: 30

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: output/*.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
