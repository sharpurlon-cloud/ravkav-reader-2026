name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v2

    - name: Build APK
      run: |
        cd reader_app
        chmod +x gradlew
        ./gradlew assemble --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v3
      if: success()
      with:
        name: EnhancedRavKavReader
        path: reader_app/build/outputs/apk/
        retention-days: 30
